<section class="mx-auto mt-16 max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
  <h1 class="text-3xl font-semibold text-gray-900">Најава</h1>
  <p class="mt-1 text-sm font-light text-gray-600">Најави се со твојот студентски е-маил.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-700">Е-маил</label>
      <input formControlName="email" type="email"
             class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Лозинка</label>
      <input formControlName="password" type="password"
             class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
    </div>

    @if (error()) {
      <p class="rounded-lg bg-red-50 px-4 py-2 text-sm text-red-700">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || loading()"
            class="w-full rounded-full bg-blue-600 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:opacity-50">
      {{ loading() ? 'Се најавува…' : 'Најави се' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-600">
    Немаш профил? <a routerLink="/register" class="font-medium text-blue-600 hover:underline">Регистрирај се</a>
  </p>
</section>
